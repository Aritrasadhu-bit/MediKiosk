name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Typecheck · Tests · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests (pure logic: red-flags, interactions, extraction, FHIR, ABHA, i18n)
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          # Avoid network/API requirements in CI — everything here is offline-capable.
          SESSION_SECRET: ci-only-insecure-secret